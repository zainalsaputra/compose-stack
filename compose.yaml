name: ${COMPOSE_PROJECT_NAME:-compose-stack}

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${JENKINS_IMAGE:-myjenkins-blueocean:lts}
    container_name: jenkins-blueocean
    restart: on-failure
    depends_on:
      docker:
        condition: service_started
    networks:
      - ci
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true}
      JENKINS_OPTS: "--prefix=/jenkins"
    ports:
      - "${JENKINS_HTTP_PORT:-49000}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - ${HOST_HOME:-/srv/jenkins/home}:/home

  nginx:
    image: nginx:stable
    container_name: jenkins-nginx
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - ci
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  docker:
    image: docker:dind
    container_name: docker
    restart: on-failure
    privileged: true
    networks:
      ci:
        aliases:
          - docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
    ports:
      - "127.0.0.1:${DOCKER_DIND_PORT:-2376}:2376"
      - "${DIND_APP_PORT:-3000}:3000"
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    networks:
      - ci
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=http://100.74.63.21/prometheus/"
      - "--web.route-prefix=/prometheus"

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    networks:
      - ci
    ports:
      - "${GRAFANA_PORT:-3031}:3000"
    environment:
      GF_SERVER_ROOT_URL: "http://100.74.63.21/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana

networks:
  ci:
    name: ${CI_NETWORK_NAME:-compose-stack-ci}
    driver: bridge

volumes:
  jenkins-data:
    name: ${JENKINS_DATA_VOLUME:-compose-stack-jenkins-data}
  jenkins-docker-certs:
    name: ${JENKINS_DOCKER_CERTS_VOLUME:-compose-stack-jenkins-docker-certs}
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME:-compose-stack-prometheus-data}
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-compose-stack-grafana-data}