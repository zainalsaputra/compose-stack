global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          app: prometheus

  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets:
          - host.docker.internal:9000
        labels:
          app: jenkins

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
