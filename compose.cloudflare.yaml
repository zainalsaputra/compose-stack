services:
  jenkins:
    group_add:
      - "${HOST_DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_STACK_HOST_PATH:-/opt/compose-stack}:/opt/compose-stack-host

  nginx:
    networks:
      - app-ingress
    volumes:
      - ./nginx/cloudflare-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/nginx/apps:/etc/nginx/app-routes:ro

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: compose-stack-cloudflared
    restart: unless-stopped
    networks:
      - ci
      - observability
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
      - run

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-compose-stack-observability}
    driver: bridge
  app-ingress:
    name: ${APP_INGRESS_NETWORK_NAME:-compose-stack-app-ingress}
    driver: bridge
