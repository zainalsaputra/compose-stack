services:
  nginx:
    networks:
      - ci
      - observability
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-compose-stack-observability}
    driver: bridge
