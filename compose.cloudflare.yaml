services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: compose-stack-cloudflared
    restart: unless-stopped
    networks:
      - ci
      - observability
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
      - run

networks:
  observability:
    name: ${OBSERVABILITY_NETWORK_NAME:-compose-stack-observability}
    driver: bridge
