name: ${COMPOSE_PROJECT_NAME:-compose-stack}

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${JENKINS_IMAGE:-myjenkins-blueocean:lts}
    container_name: jenkins-blueocean
    restart: on-failure
    depends_on:
      docker:
        condition: service_healthy
    networks:
      - ci
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: ${JENKINS_JAVA_OPTS:--Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true}
    ports:
      - "${JENKINS_HTTP_PORT:-49000}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
      - ${HOST_HOME:-/srv/jenkins/home}:/home
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:stable
    container_name: jenkins-nginx
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - ci
    ports:
      - "${NGINX_HTTP_PORT:-9000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  docker:
    image: docker:dind
    container_name: docker
    restart: on-failure
    privileged: true
    networks:
      ci:
        aliases:
          - docker
    environment:
      DOCKER_TLS_CERTDIR: /certs
    ports:
      - "127.0.0.1:${DOCKER_DIND_PORT:-2376}:2376"
      - "${DIND_APP_PORT:-3000}:3000"
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  ci:
    name: ${CI_NETWORK_NAME:-compose-stack-ci}
    driver: bridge

volumes:
  jenkins-data:
    name: ${JENKINS_DATA_VOLUME:-compose-stack-jenkins-data}
  jenkins-docker-certs:
    name: ${JENKINS_DOCKER_CERTS_VOLUME:-compose-stack-jenkins-docker-certs}
